# Rev G onboard USB option: adapter settings only, not an ATF1508 programmer.
# Load a device/TAP definition and device-specific SVF flow separately.
# EEPROM: default FTDI VID/PID, bus powered, ACBUS8=PWREN#, ACBUS1=TriState.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
transport select jtag

# Enter MPSSE before enabling U8. GPIOH1 is ACBUS1, overall GPIO bit 9.
# TCK=0, TDI=0, TMS=1; FTDI_JTAG_DISABLE=0 once MPSSE is initialized.
# Output directions: ADBUS0/1/3 and ACBUS1. ADBUS2 (TDO) stays an input.
ftdi layout_init 0x0008 0x020b
ftdi layout_signal JTAG_DISABLE -data 0x0200
adapter speed 1000

# Before manually returning the interface to UART/reset, disable its buffers:
#     ftdi set_signal JTAG_DISABLE 1
